[project]
name = "rag-application"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gaurav712-gujjar", email = "gujjargaurav712@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "bcrypt>=4.1",
    "boto3>=1.34",
    "celery[redis]>=5.4",
    "email-validator>=2.1",
    "fakeredis>=2.23",
    "fastapi>=0.115,<1",
    "fastembed>=0.9.1",
    "groq>=0.11",
    "httpx>=0.27",
    "langchain-text-splitters>=0.3",
    "numpy>=2.4.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pdf2image>=1.17",
    "pillow>=10.3",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.4",
    "pyjwt>=2.8",
    "pypdf>=4.3",
    "pytesseract>=0.3.10",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.12,<2",
    "redis>=5.0",
    "sentence-transformers>=3.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.30",
    "voyageai>=0.6.0",
]

[project.scripts]
rag-application = "rag_application:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
