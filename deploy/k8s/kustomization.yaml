apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: docchat
resources:
- namespace.yaml
- configmap.yaml
- migrate-job.yaml
- api.yaml
- worker.yaml
- frontend.yaml
- ingress.yaml
# docchat-secrets is created separately (see secret.example.yaml).
# Replace these with your registry paths, or let the release workflow run `kustomize edit set image`.
images:
- name: docchat-backend
  newName: ghcr.io/OWNER/REPO/backend
  newTag: latest
- name: docchat-frontend
  newName: ghcr.io/OWNER/REPO/frontend
  newTag: latest
