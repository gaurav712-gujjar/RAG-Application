# NOT part of kustomization.yaml on purpose: never commit real values.
# Create it once (or manage it with External Secrets / Sealed Secrets / your cloud's secret store):
#   kubectl -n docchat create secret generic docchat-secrets --from-env-file=secrets.env
# This file only documents the expected keys.
apiVersion: v1
kind: Secret
metadata:
  name: docchat-secrets
  namespace: docchat
type: Opaque
stringData:
  GROQ_API_KEY: "gsk_..."
  JWT_SECRET: "a-long-random-string-at-least-32-characters"
  DATABASE_URL: "postgresql+asyncpg://USER:PASSWORD@HOST:5432/docchat"
  REDIS_URL: "rediss://:PASSWORD@HOST:6379/0"
  QDRANT_API_KEY: "..."
  S3_ACCESS_KEY: "..."
  S3_SECRET_KEY: "..."
  # Optional:
  # METRICS_TOKEN: "..."            # then add `authorization: credentials: ...` to the Prometheus scrape job
  # OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic <base64 public:secret>"
