apiVersion: apps/v1
kind: Deployment
metadata:
  name: docchat-frontend
  labels: {app.kubernetes.io/name: docchat-frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: docchat-frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: docchat-frontend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: docchat-frontend
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: docchat-frontend
spec:
  selector: {app.kubernetes.io/name: docchat-frontend}
  ports:
    - {name: http, port: 3000, targetPort: http}
