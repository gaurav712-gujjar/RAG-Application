global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: docchat-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # If you set METRICS_TOKEN on the API, uncomment:
    # authorization:
    #   credentials: <the same token>

  - job_name: docchat-worker
    static_configs:
      - targets: ["worker:9100"]   # WORKER_METRICS_PORT
