name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as the Docker image
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install (CPU-only torch first, otherwise pip pulls ~2 GB of CUDA wheels)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Tests (fake embedder, LLM and reranker with in-memory Qdrant and Redis, so no models, keys or services)
        run: pytest -q
      - name: Fast eval smoke test (pipeline plumbing; real-model quality is in the Eval workflow)
        run: python -m evals.run_eval --fast --min hit_at_3=0.7 --out /tmp/eval-fast.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  config:
    name: Validate compose, Prometheus rules, Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose --profile observability config -q
      - name: Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/w:ro" prom/prometheus:v2.55.1 check rules /w/alerts.yml
      - name: Kubernetes manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize deploy/k8s | ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
