name: Eval

# Real-model quality check on the golden set (downloads ~4 GB of models, so it is manual or weekly).
on:
  workflow_dispatch:
    inputs:
      generate:
        description: "Also generate answers with Groq (uses tokens)"
        type: boolean
        default: false
      ragas:
        description: "Also run RAGAS judge metrics (uses MANY tokens)"
        type: boolean
        default: false
      min_hit_at_3:
        description: "Fail if retrieval hit@3 is below this"
        default: "0.85"
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC, retrieval only

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('backend/app/core/config.py') }}
      - name: Install (RAGAS pins live in requirements-eval.txt)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-eval.txt
      - name: Run evaluation
        run: |
          ARGS="--min hit_at_3=${{ inputs.min_hit_at_3 || '0.85' }} --out eval-report.json"
          if [ "${{ inputs.ragas }}" = "true" ]; then ARGS="$ARGS --ragas --min faithfulness=0.7 --min context_recall=0.7"
          elif [ "${{ inputs.generate }}" = "true" ]; then ARGS="$ARGS --generate"; fi
          python -m evals.run_eval $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: backend/eval-report.json
