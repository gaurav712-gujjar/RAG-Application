# Stack: api + worker + migrate + frontend + postgres + qdrant + redis + minio.
# Optional monitoring:  docker compose --profile observability up   (Prometheus :9090, Grafana :3001)
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://redis:6379/0
  INGEST_MODE: celery
  DB_AUTO_CREATE: "false" # schema is owned by Alembic (see the migrate service)
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: docchat
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001" # console (the app creates the bucket itself)
    volumes:
      - minio_data:/data

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    env_file: .env
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
      minio: { condition: service_started }
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/models # model weights are downloaded once

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=1
    env_file: .env
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
      minio: { condition: service_started }
    volumes:
      - hf_cache:/models

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  # ---- optional monitoring: `docker compose --profile observability up` ----
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin # change for anything but local use
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pg_data:
  qdrant_data:
  minio_data:
  hf_cache:
  prom_data:
  grafana_data:
